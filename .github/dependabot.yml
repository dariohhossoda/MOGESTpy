# Dependabot version updates
# https://docs.github.com/code-security/dependabot/dependabot-version-updates
#
# Pull requests target development, following the branch workflow in
# CONTRIBUTING.md; main only receives release pull requests.

version: 2
updates:
  - package-ecosystem: "pip" # pyproject.toml and poetry.lock (Poetry)
    directory: "/"
    target-branch: "development"
    schedule:
      interval: "weekly"
    groups:
      development:
        dependency-type: "development"
      runtime:
        dependency-type: "production"

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "development"
    schedule:
      interval: "weekly"
