[project]
name = "mogestpy"
version = "2.1.1"
description = "Water resources management model based on hydrological and hydrodynamic models"
authors = [{ name = "Dario Hachisu Hossoda", email = "dario.hossoda@usp.br" }]
license = "MIT"
license-files = ["LICENSE.md"]
readme = "README.md"
keywords = ["hydrology", "water resources", "hydrological model"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Hydrology",
]
requires-python = ">=3.11,<4.0"
dependencies = [
    "spotpy>=1.6.2,<2.0.0",
    "scikit-learn>=1.5.2,<2.0.0",
    "pandas>=2.2.3,<4.0.0",
    "tqdm>=4.67.3,<5.0.0",
    "numpy>=2.4.4,<3.0.0",
]

[project.urls]
Homepage = "https://github.com/dariohhossoda/MOGESTpy"
Repository = "https://github.com/dariohhossoda/MOGESTpy"
"Bug Tracker" = "https://github.com/dariohhossoda/MOGESTpy/issues"

[tool.poetry]
exclude = [
    { path = "Applications"},
    { path = "Datasets"},
    { path = "tests"}
]
include = [
    { path = "docs", format = "sdist" }
]

[tool.poetry.group.dev.dependencies]
matplotlib = "^3.8.0"
black = "^26.3.1"

[tool.poetry.group.test]
optional = true

[tool.poetry.group.test.dependencies]
pytest = "^9.0.3"
pytest-cov = "^7.0"
openpyxl = "^3.1.5"

[tool.poetry.group.docs]
optional = true

[tool.poetry.group.docs.dependencies]
sphinx = {version = ">=8.2,<10.0", python = ">=3.11"}
sphinxcontrib-bibtex = {version = "^2.6.5", python = ">=3.11"}
pydata-sphinx-theme = {version = "^0.23.0", python = ">=3.11"}
sphinx-gallery = {version = "^0.22.1", python = ">=3.11"}
sphinx-design = {version = "^0.7.0", python = ">=3.11"}
matplotlib = {version = "^3.8", python = ">=3.11"}

[build-system]
requires = ["poetry-core>=2.2.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
